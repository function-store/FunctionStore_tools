<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FNSTools — pick your install</title>
<style>
  :root {
    --bg: #f7f7f8;      --panel: #ffffff;   --ink: #16171a;
    --muted: #6a6d75;   --line: #e2e3e7;    --accent: #3b6ef5;
    --accent-ink: #ffffff;
    --core: #7a5af8;    --warn: #b45309;    --chip: #f0f1f4;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1012;    --panel: #17181c;   --ink: #e8e9ec;
      --muted: #9b9fa8; --line: #2a2c33;    --accent: #6b91ff;
      --accent-ink: #0f1012;
      --core: #a48cff;  --warn: #f0b429;    --chip: #23252b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1012;      --panel: #17181c;   --ink: #e8e9ec;
    --muted: #9b9fa8;   --line: #2a2c33;    --accent: #6b91ff;
    --accent-ink: #0f1012;
    --core: #a48cff;    --warn: #f0b429;    --chip: #23252b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 14px 20px;
  }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
  h1 small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  input[type=search] {
    flex: 1 1 220px; min-width: 160px; padding: 8px 12px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit;
  }
  button {
    padding: 8px 14px; border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 20px 140px; }
  .note {
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--core);
    border-radius: var(--radius); padding: 12px 16px; margin-bottom: 20px; color: var(--muted); font-size: 14px;
  }
  .note b { color: var(--ink); }
  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
    margin: 26px 0 10px; display: flex; align-items: baseline; gap: 10px;
  }
  h2 .count { font-size: 12px; letter-spacing: 0; text-transform: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 10px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; display: flex; gap: 11px; align-items: flex-start; cursor: pointer;
  }
  .card:hover { border-color: var(--accent); }
  .card.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .card.core { cursor: default; box-shadow: inset 3px 0 0 var(--core); }
  .card.core:hover { border-color: var(--line); }
  .card input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
  .body { min-width: 0; }
  .name { font-weight: 600; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .desc { color: var(--muted); font-size: 13.5px; margin-top: 3px; }
  .chips { margin-top: 7px; display: flex; gap: 5px; flex-wrap: wrap; }
  .chip {
    font-size: 11px; padding: 2px 7px; border-radius: 99px; background: var(--chip);
    color: var(--muted); white-space: nowrap;
  }
  .chip.core { background: var(--core); color: #fff; }
  .chip.hint { background: transparent; border: 1px dashed var(--warn); color: var(--warn); }
  a.help { color: var(--muted); text-decoration: none; font-size: 12px; }
  a.help:hover { color: var(--accent); text-decoration: underline; }
  footer {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
    border-top: 1px solid var(--line); padding: 12px 20px;
  }
  .sum { max-width: 1100px; margin: 0 auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .sum .n { font-weight: 600; }
  .sum .muted { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  dialog {
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
    color: var(--ink); max-width: 640px; width: 92vw; padding: 0;
  }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  .dlg { padding: 18px 20px; }
  pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; overflow-x: auto; font-size: 12.5px; max-height: 46vh;
  }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>FNSTools <small id="sub">loading…</small></h1>
    <input type="search" id="q" placeholder="Filter by name, description or category…" autocomplete="off">
    <button id="all">All</button>
    <button id="none">None</button>
    <button id="theme" title="Toggle theme">◐</button>
  </div>
</header>

<main>
  <div class="note" id="corenote"></div>
  <div id="list"></div>
  <div class="empty" id="empty" hidden>Nothing matches that filter.</div>
</main>

<footer>
  <div class="sum">
    <span><span class="n" id="cnt">0</span> tools selected</span>
    <span class="muted" id="deps"></span>
    <span class="spacer"></span>
    <button id="copy">Copy list</button>
    <button id="script">Copy install script</button>
    <button class="primary" id="save">Download selection.json</button>
  </div>
</footer>

<dialog id="dlg"><div class="dlg">
  <h3 style="margin:0 0 10px">Your selection</h3>
  <p class="muted" id="dlghint" style="color:var(--muted);margin:0 0 12px;font-size:13.5px">
    Save this as <code>selection.json</code> next to the installer COMP, or paste the
    list into the toolkit's installer.
  </p>
  <pre id="out"></pre>
  <div style="margin-top:14px;display:flex;gap:10px;justify-content:flex-end">
    <button id="close">Close</button>
    <button class="primary" id="docopy" hidden>Copy</button>
    <button class="primary" id="doinstall" hidden>Install</button>
  </div>
</div></dialog>

<script src="manifest.js"></script>
<script>
function fnsBoot() {
  var M = window.FNS_MANIFEST;
  var listEl = document.getElementById('list');
  // Served by the bootstrap's Web Server DAT and the store is still being
  // fetched: say so and poll. /manifest.js flips to the real catalog (and
  // FNS_SERVED) once the refresh lands.
  if (window.FNS_REFRESHING) {
    listEl.innerHTML = '<div class="empty">Downloading the package catalog ' +
      'from the bucket…<br>this page refreshes itself.</div>';
    document.getElementById('sub').textContent = 'refreshing store…';
    setTimeout(function () { location.reload(); }, 2500);
    return;
  }
  var served = !!window.FNS_SERVED;
  if (!M) {
    listEl.innerHTML = '<div class="empty">No <code>manifest.js</code> found.<br>' +
      'Regenerate it from TouchDesigner:<br><br>' +
      '<code>exec(open(\'packaging/build_manifest.py\').read()); Build()</code></div>';
    document.getElementById('sub').textContent = '';
    return;
  }

  var tools = M.packages.filter(function (p) { return p.kind === 'tool'; });
  var core = M.packages.filter(function (p) { return p.kind === 'core'; });
  var byName = {};
  M.packages.forEach(function (p) { byName[p.name] = p; });
  // localStorage THROWS in sandboxed contexts (data: URLs, some private
  // modes). Remembering the selection is a nicety; blanking the page
  // because storage is unavailable is not.
  function stored(key, fallback) {
    try { return localStorage.getItem(key); } catch (e) { return fallback; }
  }
  // Served mode edits the PROJECT's state: pre-check what is actually
  // installed there, so unchecking an installed tool means remove.
  // Static mode keeps the localStorage nicety.
  var installedNow = (window.FNS_INSTALLED || []).filter(function (n) {
    return byName[n] && byName[n].kind === 'tool';
  });
  var picked = served
    ? new Set(installedNow)
    : new Set(JSON.parse(stored('fns.pick', null) || '[]')
               .filter(function (n) { return byName[n]; }));

  document.getElementById('sub').textContent =
    M.packages.length + ' packages · TD ' + (M.toolkit.td_build || '');
  document.getElementById('corenote').innerHTML =
    '<b>' + core.length + ' core packages are always installed</b> — ' +
    core.map(function (c) { return c.name; }).join(', ') +
    '. They carry the registries, settings persistence and shared surfaces that ' +
    'every tool plugs into, so tools never depend on each other and you can pick ' +
    'any subset below without breaking anything.';

  // who lights up when this package is present (reverse integrations)
  var enhances = {};
  M.packages.forEach(function (p) {
    (p.integrates_with || []).forEach(function (t) {
      (enhances[t] = enhances[t] || []).push(p.name);
    });
  });

  function card(p) {
    var on = picked.has(p.name);
    var el = document.createElement('label');
    el.className = 'card' + (on ? ' on' : '');
    el.setAttribute('data-name', p.name);

    var cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = on;
    cb.addEventListener('change', function () {
      if (cb.checked) picked.add(p.name); else picked.delete(p.name);
      save(); render();
    });

    var body = document.createElement('div');
    body.className = 'body';

    var name = document.createElement('div');
    name.className = 'name';
    name.appendChild(document.createTextNode(p.name));
    if (p.help_url) {
      var a = document.createElement('a');
      a.className = 'help'; a.href = p.help_url; a.target = '_blank';
      a.rel = 'noopener'; a.textContent = 'docs ↗';
      a.addEventListener('click', function (e) { e.stopPropagation(); });
      name.appendChild(a);
    }
    body.appendChild(name);

    if (p.description) {
      var d = document.createElement('div');
      d.className = 'desc'; d.textContent = p.description;
      body.appendChild(d);
    }

    var chips = document.createElement('div');
    chips.className = 'chips';
    (p.surfaces || []).forEach(function (s) { chips.appendChild(chip(s)); });
    // an integration whose partner is not selected: say so plainly rather
    // than blocking the choice -- these degrade by design
    (p.integrates_with || []).forEach(function (t) {
      if (byName[t] && byName[t].kind === 'tool' && !picked.has(t)) {
        chips.appendChild(chip('extra features with ' + t, 'hint'));
      }
    });
    (enhances[p.name] || []).forEach(function (src) {
      if (picked.has(src) && !picked.has(p.name)) {
        chips.appendChild(chip(src + ' can use this', 'hint'));
      }
    });
    if (chips.children.length) body.appendChild(chips);

    el.appendChild(cb); el.appendChild(body);
    return el;
  }

  function chip(text, cls) {
    var c = document.createElement('span');
    c.className = 'chip' + (cls ? ' ' + cls : '');
    c.textContent = text;
    return c;
  }

  function coreCard(p) {
    var el = document.createElement('div');
    el.className = 'card core';
    var body = document.createElement('div');
    body.className = 'body';
    var n = document.createElement('div');
    n.className = 'name';
    n.appendChild(document.createTextNode(p.name));
    n.appendChild(chip('always installed', 'core'));
    body.appendChild(n);
    if (p.description) {
      var d = document.createElement('div');
      d.className = 'desc'; d.textContent = p.description;
      body.appendChild(d);
    }
    el.appendChild(body);
    return el;
  }

  function render() {
    var q = document.getElementById('q').value.trim().toLowerCase();
    function match(p) {
      if (!q) return true;
      return (p.name + ' ' + (p.description || '') + ' ' + (p.category || ''))
             .toLowerCase().indexOf(q) !== -1;
    }
    listEl.textContent = '';
    var shown = 0;
    var cats = (M.categories || []).slice();
    tools.forEach(function (p) {
      if (cats.indexOf(p.category) === -1) cats.push(p.category);
    });

    if (!q) {
      var h = document.createElement('h2');
      h.textContent = 'Core';
      var cc = document.createElement('span');
      cc.className = 'count'; cc.textContent = core.length + ' packages';
      h.appendChild(cc);
      listEl.appendChild(h);
      var g0 = document.createElement('div');
      g0.className = 'grid';
      core.forEach(function (p) { g0.appendChild(coreCard(p)); });
      listEl.appendChild(g0);
    }

    cats.forEach(function (cat) {
      if (cat === 'Core') return;
      var items = tools.filter(function (p) { return p.category === cat && match(p); });
      if (!items.length) return;
      shown += items.length;
      var sel = items.filter(function (p) { return picked.has(p.name); }).length;
      var h = document.createElement('h2');
      h.textContent = cat;
      var c = document.createElement('span');
      c.className = 'count';
      c.textContent = sel + ' of ' + items.length + ' selected';
      h.appendChild(c);
      listEl.appendChild(h);
      var g = document.createElement('div');
      g.className = 'grid';
      items.forEach(function (p) { g.appendChild(card(p)); });
      listEl.appendChild(g);
    });

    document.getElementById('empty').hidden = shown > 0 || !q;
    document.getElementById('cnt').textContent = picked.size;
    var need = new Set();
    picked.forEach(function (n) {
      (byName[n].requires || []).forEach(function (r) { need.add(r); });
    });
    var removals = served ? installedNow.filter(function (n) {
      return !picked.has(n);
    }).length : 0;
    document.getElementById('deps').textContent =
      (need.size
        ? '+ ' + need.size + ' core package' + (need.size === 1 ? '' : 's') +
          ' they need (already included)' : '') +
      (removals ? (need.size ? ' · ' : '') + removals + ' will be removed' : '');
    var save = document.getElementById('save');
    if (served) {
      save.textContent = removals ? 'Apply changes…' : 'Review install…';
      // removals alone are actionable even with nothing picked
      save.disabled = picked.size === 0 && removals === 0;
    } else {
      save.disabled = picked.size === 0;
    }
  }

  function save() {
    try {
      localStorage.setItem('fns.pick', JSON.stringify(Array.from(picked)));
    } catch (e) { /* unavailable: selection simply is not remembered */ }
  }

  function selection() {
    var chosen = Array.from(picked).sort();
    var need = new Set(M.core);
    chosen.forEach(function (n) {
      (byName[n].requires || []).forEach(function (r) { need.add(r); });
    });
    return {
      schema: 1,
      toolkit: M.toolkit.name,
      core: Array.from(need).sort(),
      tools: chosen,
      install: Array.from(need).sort().concat(chosen)
    };
  }

  document.getElementById('q').addEventListener('input', render);
  document.getElementById('all').addEventListener('click', function () {
    tools.forEach(function (p) { picked.add(p.name); }); save(); render();
  });
  document.getElementById('none').addEventListener('click', function () {
    picked.clear(); save(); render();
  });
  document.getElementById('theme').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : cur === 'light' ? null : 'dark';
    if (next) document.documentElement.setAttribute('data-theme', next);
    else document.documentElement.removeAttribute('data-theme');
  });
  // Served mode talks straight to the installer COMP; static mode
  // downloads a selection.json to feed it by hand; both offer the paste
  // rail (a Textport script) except served mode, where the user is
  // already inside TD with a one-click install in front of them.
  var HINTS = {
    selection: served
      ? 'This goes straight to the installer in your project.'
      : 'Save this as selection.json next to the installer COMP, or paste ' +
        'the list into the toolkit’s installer.',
    script: 'Paste into a TouchDesigner Textport (Dialogs ▸ Textport ' +
      'and DATs) — macOS or Windows. TD pauses briefly while it ' +
      'downloads; everything is sha256-verified against the release ' +
      'manifest before anything is installed.'
  };
  if (served) {
    document.getElementById('save').textContent = 'Review install…';
    document.getElementById('script').hidden = true;
  }
  document.getElementById('dlghint').textContent = HINTS.selection;
  // The website flavor leads with the paste rail -- a selection.json is
  // only useful to someone who already has an installer COMP.
  if (window.FNS_SITE && !served) {
    document.getElementById('script').classList.add('primary');
    document.getElementById('save').classList.remove('primary');
    var home = document.createElement('a');
    home.className = 'help';
    home.href = '/';
    home.textContent = '← tools.functionstore.xyz';
    var bar = document.querySelector('.bar');
    bar.insertBefore(home, document.getElementById('q'));
  }
  function showDialog(text, installable, hint) {
    var dlg = document.getElementById('dlg');
    document.getElementById('out').textContent = text;
    document.getElementById('doinstall').hidden = !installable;
    document.getElementById('docopy').hidden = true;
    document.getElementById('dlghint').textContent = hint || HINTS.selection;
    if (!dlg.open) dlg.showModal();
  }

  // The paste rail: one Textport line that reproduces this selection in a
  // bare project. It embeds ONLY the picked tool names -- release, URLs
  // and hashes are resolved from the ROLLING manifest at paste time, so a
  // copied script stays valid across releases. Order of operations:
  // download core + selection + bootstrap, verify every sha256 BEFORE
  // writing anything, stock the palette store (where DefaultManifest()
  // looks), drop the bootstrap, then hand its installer the selection one
  // deferred run() later -- extensions need a frame to initialize.
  // One line, because the Textport executes pasted text line by line.
  function installScript() {
    var rolling = String(M.base_url || '').replace(/\/+$/, '') + '/manifest.json';
    return [
      "import requests, hashlib, os, json, tempfile",
      "H = {'User-Agent': 'FNSTools-Install'}",
      "SEL = " + JSON.stringify(Array.from(picked).sort()),
      "m = requests.get('" + rolling + "', headers=H, timeout=30).json()",
      "idx = {p['name']: p for p in m['packages']}",
      "miss = [t for t in SEL if t not in idx]",
      "assert not miss, 'not in release %s: %s' % (m['release'], ', '.join(miss))",
      "rail = m.get('rails', {}).get('FNSTools.tox')",
      "assert rail, 'release %s publishes no bootstrap' % m['release']",
      "names = m['core'] + SEL",
      "blobs = {t: requests.get(idx[t]['artifact']['url'], headers=H, timeout=120).content for t in names}",
      "boot = requests.get(rail['url'], headers=H, timeout=120).content",
      "bad = [t for t in names if hashlib.sha256(blobs[t]).hexdigest() != idx[t]['artifact']['sha256']] + ([] if hashlib.sha256(boot).hexdigest() == rail['sha256'] else ['FNSTools.tox'])",
      "assert not bad, 'checksum mismatch: %s' % ', '.join(bad)",
      "st = os.path.join(app.userPaletteFolder, 'FNStools_ext', 'store')",
      "os.makedirs(st, exist_ok=True)",
      "_ = [open(os.path.join(st, t + '.tox'), 'wb').write(blobs[t]) for t in names]",
      "_ = open(os.path.join(st, 'manifest.json'), 'w').write(json.dumps(m, indent=1))",
      "sp = os.path.join(st, 'selection.json').replace(chr(92), '/')",
      "_ = open(sp, 'w').write(json.dumps({'schema': 1, 'toolkit': m['toolkit']['name'], 'core': m['core'], 'tools': SEL, 'install': names}, indent=1))",
      "f = os.path.join(tempfile.gettempdir(), 'FNSTools.tox')",
      "_ = open(f, 'wb').write(boot)",
      "pn = ui.panes.current",
      "pn = pn if pn.type == PaneType.NETWORKEDITOR else next(x for x in ui.panes if x.type == PaneType.NETWORKEDITOR)",
      "root = pn.owner.loadTox(f)",
      "r_ = run(\"i = op('%s/FNS_Installer'); i.par.Selectionfile = '%s'; i.par.Install.pulse()\" % (root.path, sp), delayFrames=90)",
      "print('FNSTools', m['release'], '--', len(names), 'packages verified; installing into', root.path)"
    ].join('; ');
  }

  // Clipboard with a fallback textarea INSIDE the dialog: a modal
  // <dialog> makes the rest of the document inert, so a body-level
  // textarea cannot take the selection execCommand needs.
  function toClipboard(text, btn) {
    var label = btn.textContent;
    function fed() {
      btn.textContent = 'Copied ✓';
      setTimeout(function () { btn.textContent = label; }, 1600);
    }
    function fallback() {
      var host = document.getElementById('dlg');
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      (host.open ? host : document.body).appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); fed(); } catch (e) { /* leave label */ }
      ta.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(fed, fallback);
    } else {
      fallback();
    }
  }

  document.getElementById('script').addEventListener('click', function () {
    var text = installScript();
    showDialog(text, false, HINTS.script);
    var docopy = document.getElementById('docopy');
    docopy.hidden = false;
    toClipboard(text, docopy);
  });
  document.getElementById('docopy').addEventListener('click', function () {
    toClipboard(document.getElementById('out').textContent,
                document.getElementById('docopy'));
  });
  function post(uri, body, onDone) {
    fetch(uri, {method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: body})
      .then(function (r) { return r.json(); })
      .then(onDone)
      .catch(function (e) { showDialog('Request failed: ' + e, false); });
  }
  document.getElementById('save').addEventListener('click', function () {
    if (served) {
      showDialog('Planning…', false);
      post('/selection', JSON.stringify(selection(), null, 1) + '\n',
           function (res) { showDialog(res.text, !!res.ok); });
      return;
    }
    var blob = new Blob([JSON.stringify(selection(), null, 1) + '\n'],
                        {type: 'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'selection.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });
  // Install may answer "fetching": the server downloads exactly the
  // selected packages, we show progress, and re-post once they're here.
  var installPolls = 0;
  function installOrPoll(res) {
    if (!res.fetching) { showDialog(res.text, false); return; }
    if (res.text) showDialog(res.text, false);
    if (++installPolls > 400) {
      showDialog('Download did not finish -- check the UPDATER status in TouchDesigner.', false);
      return;
    }
    setTimeout(function () {
      fetch('/status').then(function (r) { return r.json(); }).then(function (st) {
        if (st.fetching) {
          showDialog('Downloading… ' + st.fetched + ' done, ' + st.togo + ' to go', false);
          installOrPoll({fetching: true, text: ''});
        } else if (st.ready) {
          showDialog('Installing…', false);
          post('/install', '{}', installOrPoll);
        } else {
          showDialog('Download failed: ' +
            ((st.failed && st.failed.join('; ')) || 'unknown -- see UPDATER status') +
            '\nClose and try Install again to retry.', false);
        }
      }).catch(function (e) { showDialog('Status check failed: ' + e, false); });
    }, 1200);
  }
  document.getElementById('doinstall').addEventListener('click', function () {
    installPolls = 0;
    showDialog('Installing…', false);
    post('/install', '{}', installOrPoll);
  });
  document.getElementById('copy').addEventListener('click', function () {
    showDialog(JSON.stringify(selection(), null, 1), false);
    var pre = document.getElementById('out');
    var r = document.createRange(); r.selectNodeContents(pre);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    try { document.execCommand('copy'); } catch (e) { /* selection is still there */ }
  });
  document.getElementById('close').addEventListener('click', function () {
    document.getElementById('dlg').close();
  });

  render();
}

// Site mode (window.FNS_SITE, set by the website build) bakes the manifest
// at build time but prefers the live rolling copy when the bucket allows
// cross-origin reads -- the baked copy is the fallback, so a CORS-less
// bucket degrades to "as fresh as the last site deploy", not to a broken
// page. Every other mode boots on whatever manifest.js provided.
(function () {
  var baked = window.FNS_MANIFEST;
  if (!window.FNS_SITE || !baked || !baked.base_url) { fnsBoot(); return; }
  var started = false;
  function go() { if (!started) { started = true; fnsBoot(); } }
  var slow = setTimeout(go, 4000);
  try {
    fetch(String(baked.base_url).replace(/\/+$/, '') + '/manifest.json',
          {cache: 'no-store'})
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (m) {
        if (m && m.packages && m.core) window.FNS_MANIFEST = m;
      })
      .catch(function () {})
      .then(function () { clearTimeout(slow); go(); });
  } catch (e) { clearTimeout(slow); go(); }
})();
</script>
</body>
</html>
