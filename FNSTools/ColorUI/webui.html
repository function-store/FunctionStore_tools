<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ColorUI</title>
<style>
/* ColorUI rides the family's shared UI base: the block between the
   FNS:UIBASE markers is a GENERATED copy of
   packaging/configurator/base.css (edit THERE, then run
   `python packaging/configurator/sync_base.py --write`). The page's own
   dense rules keep their legacy var names, DEFINED FROM the base tokens
   just below the block -- so the whole page retints from the one family
   palette while its layout stays exactly as measured for 650x650. */
/* FNS:UIBASE:START -- generated from packaging/configurator/base.css; edit THERE, then run python packaging/configurator/sync_base.py --write */
/* FNSTools UI base -- the ONE source for the family's design tokens and
   shared components. Both web shells inline a copy of this file between
   FNS:UIBASE markers (packaging/configurator/index.html and
   FNSTools/FNS_Console/console_page.html), because each of them must stay a
   single self-contained file: one is embedded into the installer and served
   from a Text DAT inside TouchDesigner, the other doubles as a
   double-clickable standalone. Edit HERE, then run

       python packaging/configurator/sync_base.py --write

   to push the block into both shells (bare run = drift check only;
   tests/test_ui_base_sync.py refuses a release with a stale copy).

   Token values are kept in lockstep with website/docs.css on purpose: the
   /get/ flavor loads docs.css for the site chrome AND this block inline, and
   the two must never disagree (this block wins the cascade, so a drifted
   value here would restyle the site header). Change a token value in both
   places or in neither. */

:root {
  --bg: #0a0a0a;        --bg-1: #111111;      --bg-2: #161616;
  --bg-3: #1c1c1c;      --bg-deep: #050505;
  --border: #262626;    --border-strong: #3a3a3a;
  --text: #f5f5f5;      --text-dim: #a3a3a3;  --text-faint: #737373;
  --accent: #fbbf24;    --accent-dim: #2a1f08; --accent-bright: #fcd34d;
  --accent-ink: #0a0a0a;
  --green: #4ade80;     --warn: #fdba74;      --warn-dim: #2a1408;
  --err: #f87171;       --err-dim: #2a0f0f;
  --max-w: 1140px;      --radius: 10px;
  /* Height of the chrome that sits above a sticky bar. 0 on its own; the
     site flavor sets it to the site header's height. */
  --stick: 0px;
}
/* Opt-in only, and only where the page is the whole window: the site and
   TouchDesigner are dark everywhere, so embedded flavors never offer it. */
:root[data-theme="light"] {
  --bg: #f7f7f8;        --bg-1: #ffffff;      --bg-2: #f0f1f4;
  --bg-3: #e9eaee;      --bg-deep: #f2f3f5;
  --border: #e2e3e7;    --border-strong: #c6c8ce;
  --text: #16171a;      --text-dim: #5c6069;  --text-faint: #83878f;
  --accent: #a16207;    --accent-dim: #fdf3d7; --accent-bright: #854d0e;
  --accent-ink: #ffffff;
  --green: #16a34a;     --warn: #b45309;      --warn-dim: #fff5e8;
  --err: #dc2626;       --err-dim: #fdecec;
}

* { box-sizing: border-box; }
/* .btn sets display:inline-flex, and an author display beats the UA's
   [hidden] rule. Served mode hides the paste-rail button that way, and
   dialogs toggle their buttons the same way, so this has to win. */
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-bright); }
code, kbd { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.9em; }
.spacer { flex: 1 1 auto; }

/* ── buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 16px; border-radius: 8px;
  font: inherit; font-size: 14px; font-weight: 600;
  border: 1px solid transparent; cursor: pointer; white-space: nowrap;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-bright); color: var(--accent-ink); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; background: var(--accent); }
.btn-secondary { background: transparent; color: var(--text); border-color: var(--border-strong); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn-quiet {
  background: transparent; color: var(--text-dim);
  border-color: var(--border); font-weight: 500;
}
.btn-quiet:hover { border-color: var(--border-strong); color: var(--text); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── inputs ── */
input[type=search], input[type=text].fns, select.fns {
  padding: 9px 13px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg-1); color: var(--text); font: inherit; font-size: 14px;
}
input[type=search]:focus, input[type=text].fns:focus, select.fns:focus {
  outline: none; border-color: var(--accent); background: var(--bg-2);
}

/* ── eyebrow / meta ── */
.eyebrow {
  display: inline-block; padding: 5px 12px; border-radius: 999px;
  background: var(--accent-dim); color: var(--accent);
  border: 1px solid rgba(251,191,36,0.25);
  font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
}

/* ── notes ── */
.note {
  padding: 16px 20px;
  background: linear-gradient(135deg, rgba(251,191,36,0.08) 0%, var(--bg-1) 60%);
  border: 1px solid rgba(251,191,36,0.26); border-radius: 12px;
  font-size: 14px; color: var(--text-dim); line-height: 1.6;
}
.note b { color: var(--text); }
.note a { white-space: nowrap; }

/* ── category sections ── */
.cat {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  margin: 34px 0 2px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em;
}
.cat-glyph { color: var(--accent); font-size: 15px; font-weight: 400; }
.cat-count {
  font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--text-faint);
}
.cat-docs { font-size: 12px; font-weight: 500; color: var(--text-faint); }
.cat-docs:hover { color: var(--accent); }
.cat-pitch { margin: 0 0 14px; font-size: 13px; color: var(--text-faint); }

/* ── category quick-nav (jump chips under the filter bar) ── */
.catnav {
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
  padding: 8px 0 2px;
}
.catnav a {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 11px; border-radius: 999px;
  background: var(--bg-1); border: 1px solid var(--border);
  font-size: 12px; font-weight: 500; color: var(--text-dim);
  white-space: nowrap;
}
.catnav a:hover { border-color: var(--accent); color: var(--accent); }
.catnav a .g { color: var(--accent); font-size: 11px; }
.catnav a .n { color: var(--text-faint); font-size: 11px; }

/* ── the grid and cards ── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.card {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 16px; cursor: pointer;
  background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius);
  transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
}
.card:hover { border-color: var(--border-strong); background: var(--bg-2); }
.card.on {
  border-color: var(--accent);
  background: linear-gradient(135deg, rgba(251,191,36,0.07) 0%, var(--bg-1) 55%);
}
.card.rec { cursor: pointer; text-decoration: none; }
.card.rec:hover { border-color: var(--accent); }
.rec-by { font-size: 12px; opacity: .75; }
.chip.rec { border-style: dashed; }
.card.core { cursor: default; }
.card.core:hover { border-color: var(--border); background: var(--bg-1); }
.card input {
  flex: none; margin: 3px 0 0; width: 16px; height: 16px;
  accent-color: var(--accent); cursor: pointer;
}
.body { min-width: 0; flex: 1; }
.name {
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
}
.desc { margin-top: 4px; font-size: 13px; color: var(--text-dim); line-height: 1.5; }
a.help { font-size: 12px; font-weight: 500; color: var(--text-faint); }
a.help:hover { color: var(--accent); }

/* ── chips ── */
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px;
  background: var(--bg-2); border: 1px solid var(--border);
  font-size: 11px; font-weight: 500; color: var(--text-dim); white-space: nowrap;
}
.chip.core {
  background: var(--accent-dim); border-color: rgba(251,191,36,0.28); color: var(--accent);
}
.chip.hint {
  background: var(--warn-dim); border-color: rgba(251,146,60,0.3); color: var(--warn);
}
/* state chips (the updates list, install reports) */
.chip.ok { background: rgba(74,222,128,0.08); border-color: rgba(74,222,128,0.3); color: var(--green); }
.chip.warn { background: var(--warn-dim); border-color: rgba(253,186,116,0.35); color: var(--warn); }
.chip.err { background: var(--err-dim); border-color: rgba(248,113,113,0.35); color: var(--err); }
.chip.up {
  background: var(--accent-dim); border-color: rgba(251,191,36,0.4); color: var(--accent);
  font-weight: 600;
}
/* Plus: a package the gate serves only to an entitled account. Marked, not
   hidden -- the decision was "visible and locked", because a picker that
   hides them lies about what the toolkit is. It is still tickable: this
   page does not know your entitlement (the server does), and refusing the
   tick here would be a client-side lock, which is exactly the thing that
   means nothing. */
.chip.plus {
  background: var(--accent-dim); border-color: rgba(251,191,36,0.28); color: var(--accent);
  font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; font-size: 10px;
}
a.chip.plus:hover { border-color: var(--accent); }
.card.plus { border-color: rgba(251,191,36,0.22); }
/* Entitlement, served flavor only. Unlocked reads as filled (a state you
   HAVE); locked stays outlined and dimmed (a state you could have). The
   published /get/ page never sets these classes. */
.chip.plus.own {
  background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
}
.chip.plus.locked { opacity: 0.6; }
.card.plus.own { border-color: rgba(251,191,36,0.55); }
.acct { color: var(--text-dim); font-size: 12.5px; }
.acct b { color: var(--accent); font-weight: 600; }
.plus-hint { margin-top: 10px; font-size: 12.5px; color: var(--text-dim); }
.plus-hint a { color: var(--accent); }

/* ── the Plus rail: one understated line, not a storefront banner. The
   free kit is the toolkit; Plus is named as exactly what it is. ── */
.plusrail {
  display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
  margin: 14px 0 0; padding: 10px 16px;
  background: var(--bg-1); border: 1px solid var(--border);
  border-left: 2px solid rgba(251,191,36,0.5); border-radius: 8px;
  font-size: 13px; color: var(--text-dim);
}
.plusrail b { color: var(--text); font-weight: 600; }
.plusrail .mark { color: var(--accent); font-weight: 700; }

.empty { padding: 48px 0; text-align: center; color: var(--text-faint); }
.empty code {
  background: var(--bg-3); border: 1px solid var(--border);
  padding: 1px 5px; border-radius: 4px; color: var(--accent-bright);
}

/* ── summary rail ──
   Sticky rather than fixed: it rides the viewport while there is list left
   to scroll, then settles at the end of the page instead of sitting on top
   of the footer forever. */
.sum {
  position: sticky; bottom: 0; z-index: 7;
  display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  margin: 40px 0 0; padding: 14px 18px;
  background: rgba(17,17,17,0.94);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border: 1px solid var(--border); border-radius: 12px 12px 0 0;
  border-bottom: none;
}
:root[data-theme="light"] .sum { background: rgba(255,255,255,0.94); }
.sum .n { font-size: 15px; font-weight: 700; }
.sum .muted { font-size: 13px; color: var(--text-faint); }
.sum-count { display: flex; align-items: baseline; gap: 8px; }

/* ── dialogs ── */
dialog {
  max-width: 720px; width: 92vw; padding: 0; color: var(--text);
  background: var(--bg-1); border: 1px solid var(--border-strong); border-radius: 14px;
}
dialog::backdrop { background: rgba(0,0,0,0.7); }
.dlg { padding: 22px 24px 20px; }
.dlg h3 { margin: 0 0 8px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
.dlg-hint { margin: 0 0 14px; font-size: 13.5px; color: var(--text-dim); line-height: 1.6; }
.dlg pre, pre.out {
  margin: 0; padding: 14px 16px; max-height: 44vh; overflow: auto;
  background: var(--bg-deep); border: 1px solid var(--border); border-radius: 10px;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 12px; line-height: 1.6; color: var(--text-dim);
  white-space: pre-wrap; word-break: break-word;
}
.dlg-actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; }

/* ── the guided steps strip ── */
.steps {
  display: flex; gap: 18px; flex-wrap: wrap; margin: 18px 0 0; padding: 0;
  list-style: none; font-size: 13px; color: var(--text-faint);
}
.steps li { display: flex; align-items: center; gap: 8px; }
.steps li::before {
  content: attr(data-n); display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 50%; font-size: 11px; font-weight: 700;
  background: var(--bg-3); border: 1px solid var(--border-strong); color: var(--text-dim);
}
.steps li.now { color: var(--text); }
.steps li.now::before { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.steps li.done::before {
  content: '✓'; background: var(--accent-dim); border-color: var(--accent); color: var(--accent);
}
/* two to four cards, depending on what this machine remembers */
.presets {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px; margin: 6px 0 4px;
}
.preset {
  display: flex; flex-direction: column; gap: 4px; text-align: left; cursor: pointer;
  padding: 14px; border-radius: var(--radius); color: var(--text);
  background: var(--bg-2); border: 1px solid var(--border); font: inherit;
}
.preset:hover, .preset:focus-visible { border-color: var(--accent); outline: none; }
.preset b { font-size: 15px; }
.preset span { font-size: 12.5px; color: var(--text-dim); line-height: 1.45; }
.preset .pick { margin-top: 6px; font-size: 12px; color: var(--accent); }
@media (max-width: 640px) { .presets { grid-template-columns: 1fr; } }

/* ── toast ── */
.toast {
  position: fixed; bottom: 14px; right: 18px; padding: 8px 14px;
  border-radius: 8px; background: var(--bg-2); border: 1px solid var(--border);
  color: var(--text);
  opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 30;
  max-width: 70ch; word-break: break-word; font-size: 13px;
}
.toast.show { opacity: 1; }
.toast.ok { border-color: var(--green); }
.toast.err { border-color: var(--err); }

/* ── app density: the in-TD manager sets body.app; everything reads a
   notch tighter without forking any component. ── */
body.app { font-size: 13px; line-height: 1.5; }
body.app .btn { padding: 6px 12px; font-size: 13px; border-radius: 6px; }
body.app input[type=search], body.app input[type=text].fns, body.app select.fns {
  padding: 6px 10px; font-size: 13px; border-radius: 6px;
}
body.app .cat { margin: 22px 0 2px; font-size: 16px; }
body.app .card { padding: 11px 13px; }
body.app .name { font-size: 14px; }
body.app .desc { font-size: 12.5px; }
body.app .dlg h3 { font-size: 16px; }
/* FNS:UIBASE:END */

/* legacy names -> base tokens. The rules below keep reading
   --panel/--fg/--acc/...; the values come from the family palette. */
:root{
  --panel:var(--bg-1); --row:var(--bg-2); --rowh:var(--bg-3);
  --line:var(--border); --fg:var(--text); --dim:var(--text-dim);
  --acc:var(--accent); --good:var(--green); --bad:var(--err);
}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--fg);
  font:13px/1.45 -apple-system,'Segoe UI','Helvetica Neue',sans-serif;
  -webkit-user-select:none;user-select:none;
  display:flex;flex-direction:column;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

header{
  flex:none;display:flex;flex-direction:column;gap:6px;
  padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);
}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.brand{font-weight:600;letter-spacing:.4px;color:var(--acc)}
.brand small{color:var(--dim);font-weight:400;margin-left:6px}
input[type=text],input[type=number]{
  background:var(--bg);color:var(--fg);border:1px solid var(--line);
  border-radius:4px;padding:4px 8px;outline:none;font:inherit;
  -webkit-user-select:text;user-select:text;
}
input[type=text]:focus,input[type=number]:focus{border-color:var(--acc)}
#search{flex:1 1 150px;min-width:120px;max-width:340px}
button{
  background:var(--bg-2);color:var(--fg);border:1px solid var(--line);
  border-radius:4px;padding:4px 10px;font:inherit;cursor:pointer;white-space:nowrap;
}
button:hover{background:var(--bg-3);border-color:var(--border-strong)}
button.warn:hover{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.4;cursor:default}
label.chk{display:inline-flex;align-items:center;gap:5px;color:var(--dim);cursor:pointer;white-space:nowrap}
label.chk input{accent-color:var(--acc)}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.spacer{flex:1}

#famrow{
  flex:none;display:flex;gap:8px;align-items:center;padding:7px 12px;
  background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;
}
#famrow .cap{color:var(--dim);margin-right:2px}
.fam{
  display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 4px;
  background:var(--row);border:1px solid var(--line);border-radius:5px;cursor:pointer;
}
.fam:hover{background:var(--rowh)}
.fam .sw{width:20px;height:20px;border-radius:4px;border:1px solid rgba(255,255,255,.15)}
.fam.mod .nm::after{content:'•';color:var(--acc);margin-left:4px}

#nearrow{display:flex;align-items:center;gap:6px}
#nearsw{width:22px;height:22px;border-radius:4px;border:1px solid var(--line);cursor:pointer}
#neartol{width:60px}

main{flex:1;overflow-y:auto;overflow-x:hidden}
.ghead{
  position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;
  padding:4px 12px;background:var(--bg-2);border-bottom:1px solid var(--line);
  cursor:pointer;font-weight:600;color:var(--text);
}
.ghead:hover{background:var(--bg-3)}
.ghead .tri{width:12px;color:var(--dim);font-size:10px}
.ghead .cnt{color:var(--dim);font-weight:400;font-size:12px}
.ghead .gmod{color:var(--acc);font-weight:400;font-size:12px}
.ghead .gbtns{margin-left:auto;display:none;gap:6px}
.ghead:hover .gbtns{display:inline-flex}
.ghead .gbtns button{padding:1px 8px;font-size:11px}
.subhead{
  display:flex;align-items:center;gap:7px;padding:3px 12px 3px 26px;
  background:var(--bg-1);border-bottom:1px solid var(--border);cursor:pointer;
  color:var(--text-dim);font-weight:500;font-size:12.5px;
}
.subhead:hover{background:var(--bg-3)}
.subhead .tri{width:10px;color:var(--dim);font-size:9px}
.subhead .cnt{color:var(--dim);font-weight:400;font-size:11px}
.subhead .gmod{color:var(--acc);font-weight:400;font-size:11px}
.subhead .gbtns{margin-left:auto;display:none;gap:6px}
.subhead:hover .gbtns{display:inline-flex}
.subhead .gbtns button{padding:1px 8px;font-size:11px}
.row.sub{padding-left:40px}
button.armed{border-color:var(--bad);color:var(--bad)}
#grpctl{margin-left:auto;display:inline-flex;gap:6px;align-items:center}
#grpctl button{padding:2px 8px;font-size:11px;color:var(--dim)}
#modes{display:inline-flex;margin-right:4px}
#modes .cap{margin-right:6px;align-self:center}
#modes button{border-radius:0;border-right-width:0}
#modes button:first-of-type{border-radius:4px 0 0 4px}
#modes button:last-of-type{border-radius:0 4px 4px 0;border-right-width:1px}
#modes button.on{background:var(--accent-dim);border-color:var(--acc);border-right-width:1px;color:var(--acc)}
#modes button.on + button{border-left-width:0}
.row{
  display:flex;align-items:center;gap:9px;padding:3px 12px;cursor:pointer;
  border-bottom:1px solid var(--border);
}
.row:nth-child(even){background:var(--row)}
.row:hover{background:var(--rowh)}
.row .sw{
  flex:none;width:26px;height:18px;border-radius:3px;
  border:1px solid rgba(255,255,255,.14);
}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.mod .nm{color:#fff}
.row .dot{flex:none;width:6px;height:6px;border-radius:3px;background:var(--acc);visibility:hidden}
.row.mod .dot{visibility:visible}
.row .def{

</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="brand">ColorUI<small id="ver"></small></div>
    <input type="text" id="search" placeholder="filter — space = AND, * wildcard">
    <label class="chk"><input type="checkbox" id="modonly">changed only</label>
    <div id="nearrow">
      <label class="chk"><input type="checkbox" id="nearon">near</label>
      <div id="nearsw" title="reference color"></div>
      <span style="color:var(--dim)">±</span>
      <input type="number" id="neartol" min="0" max="1" step="0.01" value="0.05">
    </div>
  </div>
  <div class="hrow">
    <button id="setshown" title="apply one color to every listed element">Set shown…</button>
    <div class="sep"></div>
    <button id="randomize">Randomize</button>
    <button id="undorandom" disabled>Undo</button>
    <button id="resetall" class="warn">Reset all</button>
    <div class="sep"></div>
    <button id="import">Import</button>
    <button id="export">Export</button>
    <label class="chk"><input type="checkbox" id="autoload">auto-load</label>
  </div>
</header>

<div id="famrow"><span class="cap">Families</span><span id="grpctl"><span id="modes"><span class="cap">group by</span><button id="mprefix" class="on">prefix</button><button id="mrole">role</button></span><button id="expandall">expand all</button><button id="collapseall">collapse all</button></span></div>
<main id="list"></main>
<footer>
  <span id="conn">waiting…</span>
  <span id="counts"></span>
  <span class="spacer"></span>
  <span class="hint">click a color to edit · right side resets</span>
</footer>

<div id="overlay"></div>
<div id="picker">
  <div class="title" id="ptitle"></div>
  <canvas id="sv" width="240" height="150"></canvas>
  <canvas id="hue" width="240" height="14"></canvas>
  <div class="fields">
    <input type="text" id="hex" maxlength="7">
    <input type="number" id="fr" min="0" max="1" step="0.001">
    <input type="number" id="fg" min="0" max="1" step="0.001">
    <input type="number" id="fb" min="0" max="1" step="0.001">
  </div>
  <div class="btns">
    <button id="pdefault">Default</button>
    <button id="pclose">Close</button>
  </div>
</div>

<div id="toast"></div>
<div id="wait"><div class="pulse"></div><div>waiting for TouchDesigner…</div></div>

<script>
'use strict';
/* ================================================================ bridge */
/* Two transports, one page. Inside ColorUI's own webrender the page talks
   through document.title rewrites (TitleBridge, below) and TD answers via
   executeJavaScript into window.FNS. Served by FNS_Console under /t/ColorUI/
   it is plain http: commands POST to api/cmd and get the fresh state back,
   and a light poll keeps the view current when the in-TD panel changes
   colors. Everything above the bridge is identical in both modes. */
const SERVED = /^https?:$/.test(location.protocol);

const HttpBridge = (() => {
  let queue = [], previewSlot = null, inflight = false, pollTimer = 0;
  const API = 'api/';   // relative: resolves under /t/ColorUI/
  function post(msg, retriable) {
    if (msg.cmd === 'preview') { previewSlot = msg; pump(); return; }
    queue.push(msg);
    pump();
  }
  function take() {
    if (queue.length) return queue.shift();
    if (previewSlot) { const m = previewSlot; previewSlot = null; return m; }
    return null;
  }
  function absorb(d) {
    if (!d) return;
    (d.toasts || []).forEach(t => FNS.toast(t));
    if (d.state) FNS.setState(d.state);
    else if (d.ok === false && d.why) FNS.toast(d.why);
  }
  async function pump() {
    if (inflight) return;
    const msg = take();
    if (!msg) return;
    inflight = true;
    try {
      const r = await fetch(API + 'cmd', {method: 'POST',
        headers: {'Content-Type': 'application/json'}, body: JSON.stringify(msg)});
      absorb(await r.json());
    } catch (e) {
      FNS.toast('TouchDesigner not responding');
    } finally {
      inflight = false;
      if (queue.length || previewSlot) pump();
    }
  }
  async function poll() {
    if (document.hidden || inflight) return;
    try {
      const r = await fetch(API + 'state');
      if (r.ok) absorb(await r.json());
    } catch (e) { /* next tick */ }
  }
  function start() {
    post({cmd: 'ready'});
    clearInterval(pollTimer);
    pollTimer = setInterval(poll, 2000);
  }
  return {post, ack() {}, start};
})();

const TitleBridge = (() => {
  const CHUNK = 800;
  // per-load prefix so nonces never collide across page reloads
  const SESS = Math.random().toString(36).slice(2, 7);
  let seq = 0, wait = null, queue = [], previewSlot = null;

  function post(msg, retriable) {
    if (msg.cmd === 'preview') { previewSlot = msg; pump(); return; }
    queue.push({msg, retriable: retriable !== false});
    pump();
  }
  function take() {
    if (queue.length) return queue.shift();
    if (previewSlot) { const m = {msg: previewSlot, retriable: true}; previewSlot = null; return m; }
    return null;
  }
  function pump() {
    if (wait) return;
    const item = take();
    if (!item) return;
    const payload = JSON.stringify(item.msg);
    seq++;
    if (payload.length <= CHUNK) {
      wait = {base: seq, tries: 0, single: payload, retriable: item.retriable};
      fire();
    } else {
      const parts = [];
      for (let i = 0; i < payload.length; i += CHUNK) parts.push(payload.slice(i, i + CHUNK));
      wait = {base: seq, tries: 0, parts, idx: 0, retriable: item.retriable};
      fire();
    }
  }
  function nonce() { return SESS + wait.base + (wait.tries ? '.' + wait.tries : ''); }
  function fire() {
    if (!wait) return;
    if (wait.single !== undefined) {
      document.title = 'FNSCUI:' + nonce() + ':' + wait.single;
    } else {
      document.title = 'FNSCUI#' + nonce() + ':' + wait.idx + '/' + wait.parts.length + ':' + wait.parts[wait.idx];
    }
    clearTimeout(wait.timer);
    wait.timer = setTimeout(timeout, 1600);
  }
  function timeout() {
    if (!wait) return;
    if (wait.retriable && wait.tries < 3) { wait.tries++; fire(); return; }
    wait = null;
    FNS.toast('TouchDesigner not responding');
    pump();
  }
  function ack(n, i) {
    if (!wait || String(n) !== nonce()) return;
    clearTimeout(wait.timer);
    if (wait.single !== undefined) { wait = null; pump(); return; }
    if (i !== wait.idx) return;
    wait.idx++;
    if (wait.idx >= wait.parts.length) { wait = null; pump(); }
    else fire();
  }
  return {post, ack};
})();

const Bridge = SERVED ? HttpBridge : TitleBridge;

/* ================================================================= model */
const S = {
  colors: {}, defaults: {}, overrides: new Set(), families: [],
  names: [], connected: false, randomized: false, groupby: 'prefix',
};
const $ = id => document.getElementById(id);
const EPS = 1e-3;

function isMod(n) { return S.overrides.has(n); }
function css(rgb) {
  const c = v => Math.round(Math.max(0, Math.min(1, v)) * 255);
  return `rgb(${c(rgb[0])},${c(rgb[1])},${c(rgb[2])})`;
}
function toHex(rgb) {
  return '#' + rgb.map(v => Math.round(Math.max(0, Math.min(1, v)) * 255)
    .toString(16).padStart(2, '0')).join('');
}
function fromHex(h) {
  const m = /^#?([0-9a-f]{6})$/i.exec(h.trim());
  if (!m) return null;
  const v = parseInt(m[1], 16);
  return [((v >> 16) & 255) / 255, ((v >> 8) & 255) / 255, (v & 255) / 255];
}

/* ============================================================== TD entry */
window.FNS = {
  setState(st) {
    S.colors = st.colors; S.defaults = st.defaults;
    S.overrides = new Set(st.overrides); S.families = st.families;
    S.randomized = !!st.randomized;
    S.names = Object.keys(st.colors).filter(n => !st.families.includes(n)).sort();
    if (st.groupby) S.groupby = st.groupby === 'role' ? 'role' : 'prefix';
    syncModeButtons();
    buildGroups();
    $('autoload').checked = !!st.autoload;
    $('ver').textContent = st.version ? 'v' + st.version : '';
    if (!S.connected) { S.connected = true; $('wait').style.display = 'none'; }
    $('conn').textContent = 'connected';
    $('conn').className = 'on';
    $('undorandom').disabled = !S.randomized;
    renderFams(); renderList();
  },
  setAutoload(v) { $('autoload').checked = !!v; },
  setGroupby(v) { setGroupby(v, true); },
  toast(t) { toast(t); },
  _ack(n, i) { Bridge.ack(n, i); },
  /* TD->page payloads over the executeJavaScript size cap stream in parts */
  _rxopen() { this._buf = []; },
  _rxpart(s) { if (this._buf) this._buf.push(s); },
  _rxdone(fn) {
    if (!this._buf) return;
    const raw = this._buf.join('');
    this._buf = null;
    try { this[fn](JSON.parse(raw)); }
    catch (e) { toast('bad payload from TD: ' + e); }
  },
};

/* ============================================================ local edits */
function applyLocal(names, rgb, record) {
  const upd = {};
  for (const n of names) {
    S.colors[n] = rgb.slice();
    upd[n] = [+rgb[0].toFixed(4), +rgb[1].toFixed(4), +rgb[2].toFixed(4)];
    if (record) {
      const d = S.defaults[n];
      if (d && d.every((v, i) => Math.abs(v - rgb[i]) < EPS)) S.overrides.delete(n);
      else S.overrides.add(n);
    }
  }
  Bridge.post({cmd: record ? 'set' : 'preview', colors: upd});
  if (record) { renderFams(); renderList(); }
  else patchSwatches(names);
}
function resetNames(names) {
  const upd = {};
  for (const n of names) {
    const d = S.defaults[n];
    if (!d) continue;
    S.colors[n] = d.slice();
    S.overrides.delete(n);
    upd[n] = d.slice();
  }
  Bridge.post({cmd: 'set', colors: upd});
  renderFams(); renderList();
}

/* ================================================================ render */
function terms() {
  return $('search').value.toLowerCase().split(/\s+/).filter(Boolean);
}
function matchTerm(t, name) {
  if (!t.includes('*')) return name.includes(t);
  const parts = t.split('*');
  if (!name.startsWith(parts[0])) return false;
  if (!name.endsWith(parts[parts.length - 1])) return false;
  let pos = parts[0].length;
  for (let i = 1; i < parts.length - 1; i++) {
    const at = name.indexOf(parts[i], pos);
    if (at < 0) return false;
    pos = at + parts[i].length;
  }
  return true;
}
let near = {rgb: [0.5, 0.5, 0.5]};
function visibleNames() {
  const ts = terms(), mod = $('modonly').checked, nr = $('nearon').checked;
  const tol = Math.max(0, parseFloat($('neartol').value) || 0);
  let out = [];
  for (const n of S.names) {
    if (mod && !isMod(n)) continue;
    if (ts.length && !ts.every(t => matchTerm(t, n.toLowerCase()))) continue;
    if (nr) {
      const c = S.colors[n];
      if (Math.abs(c[0] - near.rgb[0]) > tol || Math.abs(c[1] - near.rgb[1]) > tol ||
          Math.abs(c[2] - near.rgb[2]) > tol) continue;
    }
    out.push(n);
  }
  if (nr) {
    const dist = n => S.colors[n].reduce((a, v, i) => a + Math.abs(v - near.rgb[i]), 0);
    out.sort((a, b) => dist(a) - dist(b));
  }
  return out;
}

function renderFams() {
  const host = $('famrow');
  host.querySelectorAll('.fam').forEach(e => e.remove());
  const anchor = $('grpctl');
  for (const f of S.families) {
    const el = document.createElement('div');
    el.className = 'fam' + (isMod(f) ? ' mod' : '');
    el.innerHTML = `<div class="sw" style="background:${css(S.colors[f])}"></div><span class="nm">${f}</span>`;
    el.onclick = () => openPicker([f], f);
    el.dataset.name = f;
    host.insertBefore(el, anchor);
  }
}

/* --------------------------------------------------------------- groups */
const FGROUP = 'OP families', MISC = 'misc';
let groups = [];
const expanded = new Set();
function groupOf(n) {
  if (S.groupby === 'role') {
    // last non-numeric segment, trailing digits stripped: bg1->bg, aux3->aux
    const parts = n.split('.');
    for (let i = parts.length - 1; i >= 0; i--) {
      if (!/^\d+$/.test(parts[i])) return parts[i].replace(/\d+$/, '') || parts[i];
    }
    return parts[parts.length - 1];
  }
  const p = n.split('.')[0];
  return /^[A-Z]+$/.test(p) ? FGROUP : p;
}
function subKeyOf(n) {
  if (S.groupby === 'role') return n.split('.')[0].replace(/\d+$/, '') || n.split('.')[0];
  const parts = n.split('.');
  return parts.length >= 3 ? parts[1] : null;
}
function buildSubs(gname, items) {
  if (gname === FGROUP || gname === MISC) return {direct: items.slice(), subs: []};
  const sm = new Map(), direct = [];
  for (const n of items) {
    const k = subKeyOf(n);
    if (k == null) { direct.push(n); continue; }
    if (!sm.has(k)) sm.set(k, []);
    sm.get(k).push(n);
  }
  const subs = [];
  for (const [k, si] of [...sm]) {
    if (si.length < 3) direct.push(...si);
    else subs.push({name: k, items: si});
  }
  if (subs.length < 2) return {direct: items.slice(), subs: []};
  subs.sort((a, b) => a.name.localeCompare(b.name));
  direct.sort();
  return {direct, subs};
}
function buildGroups() {
  const m = new Map();
  for (const n of S.names) {
    const g = groupOf(n);
    if (!m.has(g)) m.set(g, []);
    m.get(g).push(n);
  }
  const misc = [];
  for (const [g, items] of [...m]) {
    if (g !== FGROUP && items.length < 3) { misc.push(...items); m.delete(g); }
  }
  if (misc.length) m.set(MISC, misc.sort());
  groups = [...m.entries()].map(([name, items]) =>
      ({name, items, ...buildSubs(name, items)}))
    .sort((a, b) =>
      a.name === FGROUP ? -1 : b.name === FGROUP ? 1 :
      a.name === MISC ? 1 : b.name === MISC ? -1 :
      a.name.localeCompare(b.name));
}
function setGroupby(v, fromTD) {
  if (v !== 'prefix' && v !== 'role') v = 'prefix';
  if (v === S.groupby) { syncModeButtons(); return; }
  S.groupby = v;
  syncModeButtons();
  expanded.clear();
  collapsedSub.clear();
  buildGroups();
  renderList();
  if (!fromTD) Bridge.post({cmd: 'groupby', value: v});
}
function syncModeButtons() {
  $('mprefix').classList.toggle('on', S.groupby !== 'role');
  $('mrole').classList.toggle('on', S.groupby === 'role');
}

/* two-click confirm — native confirm() blocks forever in offscreen CEF */
function armThen(btn, fn) {
  if (btn.classList.contains('armed')) {
    btn.classList.remove('armed');
    btn.textContent = btn.dataset.idle;
    fn();
    return;
  }
  btn.dataset.idle = btn.textContent;
  btn.classList.add('armed');
  btn.textContent = 'sure?';
  setTimeout(() => {
    if (btn.classList.contains('armed')) {
      btn.classList.remove('armed');
      btn.textContent = btn.dataset.idle;
    }
  }, 2500);
}

function makeRow(n, indent) {
  const row = document.createElement('div');
  row.className = 'row' + (isMod(n) ? ' mod' : '') + (indent ? ' sub' : '');
  row.dataset.name = n;
  const d = S.defaults[n] || [0, 0, 0];
  row.innerHTML =
    `<div class="sw" style="background:${css(S.colors[n])}"></div>` +
    `<span class="nm">${n}</span><span class="dot"></span>` +
    `<span class="def"><span class="dsw" style="background:${css(d)}"></span><button>reset</button></span>`;
  row.querySelector('.def button').onclick = e => { e.stopPropagation(); resetNames([n]); };
  row.onclick = () => openPicker([n], n);
  return row;
}
function makeGhead(g, items, changed, open, filtering) {
  const h = document.createElement('div');
  h.className = 'ghead';
  h.innerHTML =
    `<span class="tri">${open ? '▾' : '▸'}</span>` +
    `<span>${g.name}</span><span class="cnt">${items.length}</span>` +
    (changed ? `<span class="gmod">${changed} changed</span>` : '') +
    `<span class="gbtns"><button class="gset">set…</button>` +
    (changed ? '<button class="greset">reset</button>' : '') + '</span>';
  h.querySelector('.gset').onclick = e => {
    e.stopPropagation();
    openPicker(items.slice(), `set ${items.length} in ${g.name}`);
  };
  const gr = h.querySelector('.greset');
  if (gr) gr.onclick = e => {
    e.stopPropagation();
    armThen(gr, () => resetNames(g.items.filter(isMod)));
  };
  if (!filtering) h.onclick = () => {
    if (expanded.has(g.name)) expanded.delete(g.name);
    else expanded.add(g.name);
    renderList();
  };
  return h;
}
const collapsedSub = new Set();   // subs default OPEN; this tracks closed ones
function makeSubhead(g, sub, items, filtering) {
  const key = g.name + '/' + sub.name;
  const open = filtering || !collapsedSub.has(key);
  const changed = sub.items.filter(isMod).length;
  const h = document.createElement('div');
  h.className = 'subhead';
  h.innerHTML =
    `<span class="tri">${open ? '▾' : '▸'}</span>` +
    `<span>${sub.name}</span><span class="cnt">${items.length}</span>` +
    (changed ? `<span class="gmod">${changed} changed</span>` : '') +
    `<span class="gbtns"><button class="gset">set…</button>` +
    (changed ? '<button class="greset">reset</button>' : '') + '</span>';
  h.querySelector('.gset').onclick = e => {
    e.stopPropagation();
    openPicker(items.slice(), `set ${items.length} in ${g.name} · ${sub.name}`);
  };
  const gr = h.querySelector('.greset');
  if (gr) gr.onclick = e => {
    e.stopPropagation();
    armThen(gr, () => resetNames(sub.items.filter(isMod)));
  };
  if (!filtering) h.onclick = () => {
    if (collapsedSub.has(key)) collapsedSub.delete(key);
    else collapsedSub.add(key);
    renderList();
  };
  return h;
}

let shown = [];
function renderList() {
  shown = visibleNames();
  const visSet = new Set(shown);
  const filtering = !!(terms().length || $('modonly').checked || $('nearon').checked);
  const host = $('list');
  const frag = document.createDocumentFragment();
  if ($('nearon').checked) {
    // proximity search reads best as one distance-sorted list
    for (const n of shown) frag.appendChild(makeRow(n));
  } else {
    for (const g of groups) {
      const items = g.items.filter(n => visSet.has(n));
      if (!items.length) continue;
      const changed = g.items.filter(isMod).length;
      const open = filtering || expanded.has(g.name);
      frag.appendChild(makeGhead(g, items, changed, open, filtering));
      if (!open) continue;
      if (!g.subs.length) {
        for (const n of items) frag.appendChild(makeRow(n));
        continue;
      }
      for (const n of g.direct) {
        if (visSet.has(n)) frag.appendChild(makeRow(n));
      }
      for (const sub of g.subs) {
        const si = sub.items.filter(n => visSet.has(n));
        if (!si.length) continue;
        frag.appendChild(makeSubhead(g, sub, si, filtering));
        if (filtering || !collapsedSub.has(g.name + '/' + sub.name)) {
          for (const n of si) frag.appendChild(makeRow(n, true));
        }
      }
    }
  }
  host.replaceChildren(frag);
  $('counts').textContent =
    `${shown.length} shown / ${S.names.length} elements · ${S.overrides.size} changed`;
}
function patchSwatches(names) {
  const set = new Set(names);
  for (const row of $('list').children) {
    if (set.has(row.dataset.name)) {
      row.querySelector('.sw').style.background = css(S.colors[row.dataset.name]);
    }
  }
  for (const f of $('famrow').querySelectorAll('.fam')) {
    if (set.has(f.dataset.name)) {
      f.querySelector('.sw').style.background = css(S.colors[f.dataset.name]);
    }
  }
}

/* ================================================================ picker */
const P = {names: [], hsv: [0, 0, 1], local: null, throttle: 0};

function rgb2hsv(r, g, b) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) {
    if (mx === r) h = ((g - b) / d) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h = (h * 60 + 360) % 360;
  }
  return [h, mx ? d / mx : 0, mx];
}
function hsv2rgb(h, s, v) {
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let r = 0, g = 0, b = 0;
  if (h < 60) [r, g, b] = [c, x, 0]; else if (h < 120) [r, g, b] = [x, c, 0];
  else if (h < 180) [r, g, b] = [0, c, x]; else if (h < 240) [r, g, b] = [0, x, c];
  else if (h < 300) [r, g, b] = [x, 0, c]; else [r, g, b] = [c, 0, x];
  return [r + m, g + m, b + m];
}
function drawPicker() {
  const sv = $('sv').getContext('2d'), W = 240, H = 150;
  const base = hsv2rgb(P.hsv[0], 1, 1);
  const gx = sv.createLinearGradient(0, 0, W, 0);
  gx.addColorStop(0, '#fff'); gx.addColorStop(1, css(base));
  sv.fillStyle = gx; sv.fillRect(0, 0, W, H);
  const gy = sv.createLinearGradient(0, 0, 0, H);
  gy.addColorStop(0, 'rgba(0,0,0,0)'); gy.addColorStop(1, '#000');
  sv.fillStyle = gy; sv.fillRect(0, 0, W, H);
  const px = P.hsv[1] * W, py = (1 - P.hsv[2]) * H;
  sv.strokeStyle = '#fff'; sv.lineWidth = 2;
  sv.beginPath(); sv.arc(px, py, 6, 0, 7); sv.stroke();
  sv.strokeStyle = '#000'; sv.lineWidth = 1;
  sv.beginPath(); sv.arc(px, py, 7, 0, 7); sv.stroke();

  const hu = $('hue').getContext('2d');
  const gh = hu.createLinearGradient(0, 0, W, 0);
  for (let i = 0; i <= 6; i++) gh.addColorStop(i / 6, css(hsv2rgb(i * 60 % 360, 1, 1)));
  hu.fillStyle = gh; hu.fillRect(0, 0, W, 14);
  const hx = P.hsv[0] / 360 * W;
  hu.strokeStyle = '#fff'; hu.lineWidth = 2; hu.strokeRect(hx - 2, 0, 4, 14);
}
function pickerRGB() { return hsv2rgb(P.hsv[0], P.hsv[1], P.hsv[2]); }
function syncFields() {
  const rgb = pickerRGB();
  $('hex').value = toHex(rgb);
  $('fr').value = rgb[0].toFixed(3);
  $('fg').value = rgb[1].toFixed(3);
  $('fb').value = rgb[2].toFixed(3);
}
function pickerPreview() {
  const rgb = pickerRGB();
  if (P.local) { P.local(rgb); return; }
  const now = Date.now();
  if (now - P.throttle > 70) { P.throttle = now; applyLocal(P.names, rgb, false); }
}
function pickerCommit() {
  const rgb = pickerRGB();
  if (P.local) { P.local(rgb); return; }
  applyLocal(P.names, rgb, true);
}
function openPicker(names, title, localCb, startRGB) {
  P.names = names; P.local = localCb || null;
  const rgb = startRGB || (names.length ? S.colors[names[0]].slice() : [0.5, 0.5, 0.5]);
  P.hsv = rgb2hsv(rgb[0], rgb[1], rgb[2]);
  $('ptitle').textContent = title;
  $('pdefault').style.display =
    (!localCb && names.length === 1 && S.defaults[names[0]]) ? '' : 'none';
  $('overlay').style.display = 'block';
  const pk = $('picker');
  pk.style.display = 'flex';
  pk.style.left = Math.max(8, (innerWidth - 264) / 2) + 'px';
  pk.style.top = Math.max(8, (innerHeight - 320) / 2) + 'px';
  drawPicker(); syncFields();
}
function closePicker() {
  $('picker').style.display = 'none';
  $('overlay').style.display = 'none';
  P.names = []; P.local = null;
}

function dragCanvas(cv, move) {
  let on = false;
  cv.addEventListener('mousedown', e => { on = true; move(e); });
  window.addEventListener('mousemove', e => { if (on) move(e); });
  window.addEventListener('mouseup', () => {
    if (!on) return;
    on = false;
    if ($('picker').style.display !== 'none') pickerCommit();
  });
}
dragCanvas($('sv'), e => {
  const r = $('sv').getBoundingClientRect();
  P.hsv[1] = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  P.hsv[2] = 1 - Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
  drawPicker(); syncFields(); pickerPreview();
});
dragCanvas($('hue'), e => {
  const r = $('hue').getBoundingClientRect();
  P.hsv[0] = Math.max(0, Math.min(0.9999, (e.clientX - r.left) / r.width)) * 360;
  drawPicker(); syncFields(); pickerPreview();
});
$('hex').addEventListener('change', () => {
  const rgb = fromHex($('hex').value);
  if (rgb) { P.hsv = rgb2hsv(...rgb); drawPicker(); syncFields(); pickerCommit(); }
});
for (const id of ['fr', 'fg', 'fb']) {
  $(id).addEventListener('change', () => {
    const rgb = [$('fr'), $('fg'), $('fb')].map(i =>
      Math.max(0, Math.min(1, parseFloat(i.value) || 0)));
    P.hsv = rgb2hsv(...rgb); drawPicker(); syncFields(); pickerCommit();
  });
}
$('pdefault').onclick = () => {
  if (P.names.length === 1) { resetNames(P.names); closePicker(); }
};
$('pclose').onclick = closePicker;
$('overlay').onclick = closePicker;

/* =============================================================== toolbar */
let refilter;
for (const id of ['search', 'modonly', 'nearon', 'neartol']) {
  $(id).addEventListener('input', () => {
    clearTimeout(refilter);
    refilter = setTimeout(renderList, 120);
  });
}
$('nearsw').onclick = () =>
  openPicker([], 'reference color', rgb => {
    near.rgb = rgb;
    $('nearsw').style.background = css(rgb);
    if ($('nearon').checked) renderList();
  }, near.rgb);
$('setshown').onclick = () => {
  if (!shown.length) return;
  openPicker(shown.slice(), `set ${shown.length} shown elements`);
};
$('randomize').onclick = () => Bridge.post({cmd: 'randomize'});
$('undorandom').onclick = () => Bridge.post({cmd: 'undoRandom'});
$('resetall').onclick = e => armThen(e.currentTarget, () => Bridge.post({cmd: 'resetAll'}));
$('expandall').onclick = () => {
  groups.forEach(g => expanded.add(g.name));
  collapsedSub.clear();
  renderList();
};
$('collapseall').onclick = () => { expanded.clear(); collapsedSub.clear(); renderList(); };
$('mprefix').onclick = () => setGroupby('prefix');
$('mrole').onclick = () => setGroupby('role');
$('import').onclick = () => Bridge.post({cmd: 'import'}, false);
$('export').onclick = () => Bridge.post({cmd: 'export'}, false);
$('autoload').addEventListener('change', () =>
  Bridge.post({cmd: 'autoload', value: $('autoload').checked}));

/* ================================================================= misc */
let toastTimer;
function toast(t) {
  const el = $('toast');
  el.textContent = t;
  el.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.style.opacity = 0, 2600);
}
$('nearsw').style.background = css(near.rgb);
if (SERVED) Bridge.start(); else Bridge.post({cmd: 'ready'});
</script>
</body>
</html>
